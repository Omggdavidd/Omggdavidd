<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">David Amaefula — Software Developer</title>
  <desc id="desc">A modern blue and violet banner introducing David Amaefula as a software developer who builds reliable systems from messy inputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#17142d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="25" r="145" fill="#1d4ed8" opacity=".18" filter="url(#blur)"/>
  <circle cx="1120" cy="260" r="130" fill="#7c3aed" opacity=".2" filter="url(#blur)"/>
  <g opacity=".55" stroke="#64748b" fill="none">
    <path d="M925 62h80l40 40h80"/>
    <path d="M955 235h70l32-32h92"/>
    <circle cx="925" cy="62" r="5" fill="#60a5fa" stroke="none"/>
    <circle cx="1149" cy="203" r="5" fill="#a78bfa" stroke="none"/>
    <rect x="1025" y="102" width="102" height="102" rx="18" stroke="#a78bfa" stroke-width="2"/>
    <path d="m1065 135-18 18 18 18M1087 135l18 18-18 18" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="64" y="51" width="72" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="64" y="126" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750" letter-spacing="-1.5">David Amaefula</text>
  <text x="65" y="173" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">Full-stack developer building reliable AI, data &amp; product systems.</text>
  <text x="65" y="220" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">I like turning messy real-world problems into software people can trust.</text>
